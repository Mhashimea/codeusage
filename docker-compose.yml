version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: afterburn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afterburn
    ports:
      - "5433:5432"
    volumes:
      - afterburn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  afterburn_postgres_data:
