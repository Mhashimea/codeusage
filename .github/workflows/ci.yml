name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codeusage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codeusage_test
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3003

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: Run migrations
        run: bun db:migrate

      - name: Test
        run: bun test
