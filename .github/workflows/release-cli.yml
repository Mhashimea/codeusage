name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter @codeusage/shared build
          bun run --filter codeusage build

      - name: Create tarball
        run: |
          cd packages/cli
          npm pack
          mv codeusage-*.tgz codeusage-cli.tgz

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/cli-v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: CLI v${{ steps.version.outputs.version }}
          body: |
            ## Install

            ```bash
            npm install -g ${{ github.server_url }}/${{ github.repository }}/releases/download/cli-v${{ steps.version.outputs.version }}/codeusage-cli.tgz
            ```

            Or download and install locally:
            ```bash
            npm install -g ./codeusage-cli.tgz
            ```
          files: packages/cli/codeusage-cli.tgz
          draft: false
          prerelease: false
