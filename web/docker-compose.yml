services:
  postgres:
    image: postgres:16-alpine
    container_name: afterburn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: afterburn
      POSTGRES_PASSWORD: afterburn_local
      POSTGRES_DB: afterburn
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with local PostgreSQL
    volumes:
      - afterburn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterburn -d afterburn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  afterburn_postgres_data:
